name: Destroy Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prd

permissions: {}

jobs:
  terraform-destroy:
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment == 'prd' && 'Production' || 'Development' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: frasermolyneux/actions/terraform-destroy@terraform-destroy/v1.3
        with:
          terraform-folder: "terraform"
          terraform-var-file: ${{ inputs.environment == 'prd' && 'tfvars/prd.tfvars' || 'tfvars/dev.tfvars' }}
          terraform-backend-file: ${{ inputs.environment == 'prd' && 'backends/prd.backend.hcl' || 'backends/dev.backend.hcl' }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Remove automatically recreated Failure Anomalies rule
        if: inputs.environment == 'dev'
        shell: bash
        run: |
          smart_detector_id="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-craftpledge-dev-swedencentral/providers/Microsoft.AlertsManagement/smartDetectorAlertRules/Failure Anomalies - ai-craftpledge-dev-swedencentral"

          if az resource show --ids "$smart_detector_id" --api-version 2021-04-01 --only-show-errors >/dev/null 2>&1; then
            echo "Deleting $smart_detector_id"
            az resource delete --ids "$smart_detector_id" --api-version 2021-04-01 --only-show-errors
          fi

      - name: Assert development resource group is empty
        if: inputs.environment == 'dev'
        shell: bash
        run: |
          resource_group="rg-craftpledge-dev-swedencentral"
          service_plan_id="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$resource_group/providers/Microsoft.Web/serverfarms/asp-craftpledge-dev-swedencentral-default"

          for attempt in {1..6}; do
            remaining_resource_ids="$(az resource list --resource-group "$resource_group" --query "[].id" --output tsv --only-show-errors)"
            service_plan_exists=false

            if az resource show --ids "$service_plan_id" --only-show-errors >/dev/null 2>&1; then
              service_plan_exists=true
            fi

            if [ -z "$remaining_resource_ids" ] && [ "$service_plan_exists" = false ]; then
              echo "Development resource group contains no workload resources."
              exit 0
            fi

            if [ "$attempt" -lt 6 ]; then
              echo "Resources remain after destroy; retrying inventory assertion in 10 seconds."
              sleep 10
            fi
          done

          echo "::error::Development destroy left Azure resources behind."
          if [ -n "$remaining_resource_ids" ]; then
            printf '%s\n' "$remaining_resource_ids"
          fi
          if [ "$service_plan_exists" = true ] && ! grep -Fqx "$service_plan_id" <<< "$remaining_resource_ids"; then
            echo "$service_plan_id"
          fi
          exit 1
